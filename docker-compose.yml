services:
  bot:
    image: "bot"
    stop_signal: SIGINT
    build:
      context: .
    working_dir: "/usr/src/app/bot"
    volumes:
      # Kod, media/ va files/ (admin /media orqali yuklagan rasm va PDF'lar) serverdagi papkada saqlanadi
      - .:/usr/src/app/bot
    # Har ishga tushishda migratsiyalar qo'llanadi (yangi jadval/ustunlar bo'lsa), keyin bot
    command: sh -c "alembic upgrade head && python3 bot.py"
    restart: always
    env_file:
      - ".env"
    environment:
      DB_HOST: pg_database
      DB_PORT: 5432
      TZ: Asia/Tashkent
    depends_on:
      pg_database:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  pg_database:
    image: postgres:16-alpine
    # Port tashqariga ochilmaydi — bot bazaga Docker tarmog'i ichidan ulanadi
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - '.env'
    environment:
      TZ: Asia/Tashkent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

